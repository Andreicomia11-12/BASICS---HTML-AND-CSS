<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>

  <section class="wrapper-main">
    <form action="../BASIC HTML TAGS/html lesson/HTML-TAGS.html" method="post">
      
      <label for="fname">First Name</label>
      <input type="text" name="fname" id="fname" placeholder="fname">
      <br><br>
      <label for="text-area">Message</label><br>
      <textarea name="text-area" id="text-area"></textarea>
      <br><br>

      <label for="">What is your eye Color</label><br><br>
      <input type="radio" name="eyecolor" id="eyecolor" value="blue">
      <label for="eyecolor">Blue</label>

      <input type="radio" name="eyecolor" id="eyecolor" value="green">
      <label for="eyecolor">Green</label>

      <input type="radio" name="eyecolor" id="eyecolor" value="red">
      <label for="eyecolor">Red</label>


      <br><br>

      <label for="">What is your pet type</label><br><br>
      <input type="checkbox" name="pet-type" id="pet-type" value="cat">
      <label for="pet-type">Cat</label>

      <input type="checkbox" name="pet-type" id="pet-type" value="dog">
      <label for="pet-type">Dog</label>

      <input type="checkbox" name="pet-type" id="pet-type" value="bird">
      <label for="pet-type">Bird</label>

      <br><br>

      <label for="">What is your car</label><br><br>
      <select name="car-type" id="car-type">
        <option value="ford">Ford</option>
        <option value="Mustang">Mustang</option>
        <option value="Toyota">Toyota</option>
      </select>
    </form>
  </section>


</body>
</html>
